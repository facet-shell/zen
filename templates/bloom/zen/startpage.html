<!doctype html>
<!-- facet start page for Zen, bloom style ({{name}}). Generated by `facet theme`; edit
     templates/bloom/zen/startpage.html instead. Zen opens it as its home page.
     The search takes the launcher's shortcuts: "yt lofi", "aw hyprland", "gh quickshell". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facet</title>
<style>
  :root {
    color-scheme: dark;
    --page: {{tones.page}};
    --surface: {{tones.surface}};
    --container: {{tones.container}};
    --high: {{tones.high}};
    --primary: {{tones.primary}};
    --on-primary: {{tones.onPrimary}};
    --sc: {{tones.secondaryContainer}};
    --tertiary: {{tones.tertiary}};
    --text: {{tones.text}};
    --dim: {{tones.dim}};
    --outline: {{tones.outline}};
    --emph: cubic-bezier(.05, .7, .1, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--text);
    font: 15px/1.45 "Rubik", ui-sans-serif, system-ui, sans-serif;
    display: grid;
    place-items: center;
  }
  /* Material Symbols Rounded comes with the bloom style; without it the icon names show as words */
  .ms {
    font-family: "Material Symbols Rounded";
    font-weight: normal;
    font-style: normal;
    font-size: 22px;
    line-height: 1;
    font-variation-settings: "FILL" 0, "wght" 500, "opsz" 24;
    user-select: none;
  }
  main {
    width: min(720px, calc(100vw - 32px));
    background: var(--surface);
    border-radius: 30px;
    padding: 34px 34px 26px;
    animation: rise .5s var(--emph);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .head { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 600; margin-bottom: 14px; }
  .head .ms { font-size: 24px; font-variation-settings: "FILL" 1, "wght" 500, "opsz" 24; }
  .clock { font-size: 76px; font-weight: 500; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .date { color: var(--dim); margin: 8px 0 26px; }
  form {
    display: flex; align-items: center; gap: 12px;
    background: var(--container); border-radius: 999px; padding: 12px 14px 12px 18px;
    outline: 2px solid transparent; transition: outline-color .2s;
  }
  form:focus-within { outline-color: var(--primary); }
  form > .ms { color: var(--dim); }
  input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 18px;
  }
  input::placeholder { color: var(--dim); opacity: .7; }
  /* The engine in use as a filled pill, like a picked item in bloom */
  .engine {
    background: var(--primary); color: var(--on-primary);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600;
    min-width: 6ch; text-align: center;
  }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  nav a {
    display: flex; gap: 8px; align-items: center;
    color: var(--text); text-decoration: none;
    background: var(--container); border-radius: 12px; padding: 8px 14px;
    transition: background .2s;
  }
  nav a:hover, nav a:focus { background: var(--sc); outline: 0; }
  nav a b { color: var(--primary); font-weight: 600; font-size: 13px; }
  footer { margin-top: 22px; color: var(--dim); opacity: .75; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <div class="head"><span class="ms">local_florist</span>facet</div>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form id="search" autocomplete="off">
    <span class="ms">search</span>
    <input id="q" autofocus placeholder="Search · g ddg yt gh aw aur w r">
    <span class="engine" id="engine">ddg</span>
  </form>
  <nav>
    <a href="https://github.com"><b>gh</b>GitHub</a>
    <a href="https://www.youtube.com"><b>yt</b>YouTube</a>
    <a href="https://wiki.archlinux.org"><b>aw</b>Arch Wiki</a>
    <a href="https://aur.archlinux.org"><b>aur</b>AUR</a>
    <a href="https://www.reddit.com"><b>r</b>Reddit</a>
    <a href="https://claude.ai"><b>c</b>Claude</a>
  </nav>
  <footer>Enter searches · a shortcut first picks the engine · an address opens directly</footer>
</main>
<script>
  // The same engines and shortcuts as the launcher's "?" (quickshell config/Config.qml)
  const engines = {
    g: "https://www.google.com/search?q=%s",
    ddg: "https://duckduckgo.com/?q=%s",
    yt: "https://www.youtube.com/results?search_query=%s",
    gh: "https://github.com/search?q=%s",
    aw: "https://wiki.archlinux.org/index.php?search=%s",
    aur: "https://aur.archlinux.org/packages?K=%s",
    w: "https://en.wikipedia.org/w/index.php?search=%s",
    r: "https://www.reddit.com/search/?q=%s"
  };
  const fallback = "ddg";
  const q = document.getElementById("q");
  const label = document.getElementById("engine");

  function parse(text) {
    const words = text.trim().split(/\s+/);
    if (words.length > 1 && engines[words[0]]) return { key: words[0], rest: words.slice(1).join(" ") };
    return { key: fallback, rest: text.trim() };
  }

  q.addEventListener("input", () => { label.textContent = parse(q.value).key; });

  document.getElementById("search").addEventListener("submit", event => {
    event.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    // "archlinux.org" or "localhost:8080/x" opens as it is
    if (!/\s/.test(text) && /^([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$|^localhost(:\d+)?(\/.*)?$/i.test(text)) {
      location.href = /^https?:\/\//i.test(text) ? text : `https://${text}`;
      return;
    }
    const { key, rest } = parse(text);
    location.href = engines[key].replace("%s", encodeURIComponent(rest));
  });

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    document.getElementById("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
